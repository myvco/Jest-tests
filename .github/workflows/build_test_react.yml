name: Build, Test, Publish and Deploy React App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on Node.js 24
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Node.js 24 ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Generate JSDoc
        run: npm run jsdoc
      - name: Build React App
        id: build
        run: npm run build
      - name: Build report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          if [[ ${{ steps.build.outcome }} == "success" ]]; then
          echo "✅ Build succeeded"
          else
          echo "❌ Build failed"
          fi
      - name: Setup pages
        id: pages
        uses: actions/configure-pages@v3
      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    name: Test on Node.js 24.x
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Node.js 24.x
        uses: ./.github/actions/install-node
      - name: Intégration tests
        id: int-test
        run: npm test
      - name: Test report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          if [[ ${{ steps.int-test.outcome }} == "success" ]]; then
            echo "✅ Integration Tests passed"
          else
            echo "❌ Integration Tests failed"
          fi
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true


  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: ./.github/actions/install-node
      - name: Debug env
        run: |
          echo "MYSQL_USER=$MYSQL_USER"
          echo "MYSQL_DATABASE=$MYSQL_DATABASE"

      # 🔥 Lancer toute la stack backend (API + DB)
      - name: Start backend stack
        run: |
          docker compose down -v
          docker compose up -d --build

      # 🔎 Attendre que l'API soit prête
      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/users > /dev/null; then
              echo "✅ Backend is ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Backend failed to start"
          docker compose logs
          exit 1

      # 🔨 Build frontend
      - name: Build app
        run: npm run build

      # 🧪 Cypress
      - name: Run e2e tests with Cypress
        id: e2e-test
        uses: cypress-io/github-action@v6
        with:
          install: false
          wait-on: "http://localhost:5173, http://localhost:8000/users"
          wait-on-timeout: 120

      # 📊 Report
      - name: E2E Test report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          OUTCOME="${{ steps.e2e-test.outcome }}"
          if [[ "$OUTCOME" == "success" ]]; then
            echo "✅ End-to-End Tests passed"
          else
            echo "❌ End-to-End Tests failed"
          fi
      - name: Stop containers
        if: always()
        run: docker compose down

  publish:
    name: 📦 Publish to npm
    runs-on: ubuntu-latest
    needs: [build, test, e2e]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
      - name: Version Check
        id: version-check
        run: |
          LOCAL_VERSION=$(jq -r '.version' package.json)
          echo "Local version: $LOCAL_VERSION"

          PUBLISHED_VERSION=$(npm view @myvco/projet-test version 2>/dev/null || echo "none")
          echo "Published version: $PUBLISHED_VERSION"

          if [[ "$PUBLISHED_VERSION" == "none" ]]; then
            echo "First publish detected"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [[ "$(printf '%s\n' "$PUBLISHED_VERSION" "$LOCAL_VERSION" | sort -V | tail -n1)" == "$LOCAL_VERSION" && "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]]; then
            echo "✅ Version is ready to publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Version must be greater than published version"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi
      - name: 📦 Publish
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          npm run build:npm
          npm publish --access public

  docker-build-and-run:
    name: 🐳 Build and Run Docker Containers
    runs-on: ubuntu-latest
    needs: [publish]
    env:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Get npm version
        id: version-tag
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      - name: Build and run Docker
        run: |
          docker compose up --build -d
      - name: Wait 3 seconds for services to initialize
        run: sleep 3
      - name: Verify MySQL is running
        run: |
          if docker compose exec db mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent > /dev/null 2>&1; then            echo "✅ MySQL is running"
          else
            echo "❌ MySQL is not running"
            docker logs db
            exit 1
          fi
      - name: Verify API is running
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/users)
          echo "$RESPONSE"
          USERS_COUNT=$(echo "$RESPONSE" | jq '.utilisateurs | length')
          if [[ $USERS_COUNT -eq 0 ]]; then
            echo "❌ Error: Users list is empty"
            exit 1
          fi
          echo "✅ API is running with $USERS_COUNT user(s)"
      - name: Verify Web is running
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5173)
          if [[ "$HTTP_STATUS" -eq 200 || "$HTTP_STATUS" -eq 302 ]]; then
            echo "✅ Web application is running status code: $HTTP_STATUS"
          else
            echo "❌ Web application is not running status code: $HTTP_STATUS"
            exit 1
          fi
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Tag Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.version-tag.outputs.VERSION }}
        run: |
          docker tag api_python $DOCKER_USERNAME/api_python:latest
          docker tag api_python $DOCKER_USERNAME/api_python:$IMAGE_TAG
      - name: Push images to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.version-tag.outputs.VERSION }}
        run: |
          docker push $DOCKER_USERNAME/api_python:latest
          docker push $DOCKER_USERNAME/api_python:$IMAGE_TAG

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4