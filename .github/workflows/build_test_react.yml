name: Build, Test, Publish and Deploy React App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on Node.js 24.x
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.js and dependencies
        uses: ./.github/actions/install-node

      - name: Generate JSDoc
        run: npm run jsdoc

      - name: Build app
        id: build
        run: npm run build

      - name: Build report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          if [[ "${{ steps.build.outcome }}" == "success" ]]; then
            echo "✅ Build succeeded"
          else
            echo "❌ Build failed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  test:
    name: Test on Node.js 24.x
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.js and dependencies
        uses: ./.github/actions/install-node

      - name:  Run tests
        id: int-test
        run: npm test

      - name: Test report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          if [[ "${{ steps.int-test.outcome }}" == "success" ]]; then
            echo "✅ Integration tests passed"
          else
            echo "❌ Integration tests failed"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: true

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.js and dependencies
        uses: ./.github/actions/install-node

      - name: Debug env
        run: |
          echo "MYSQL_USER=$MYSQL_USER"
          echo "MYSQL_DATABASE=$MYSQL_DATABASE"
          echo "MYSQL_HOST=$MYSQL_HOST"

      - name: Start application stack
        run: |
          docker compose down -v || true
          docker compose up -d --build

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API..."
          for i in {1..40}; do
            if curl -sf http://localhost:8000/users > /dev/null; then
              echo "✅ API is ready"
              exit 0
            fi
            sleep 3
          done
          echo "❌ API failed to start"
          docker compose logs
          exit 1

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend..."
          for i in {1..40}; do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "✅ Frontend is ready"
              exit 0
            fi
            sleep 3
          done
          echo "❌ Frontend failed to start"
          docker compose logs
          exit 1

      - name: Install Cypress binary
        run: npx cypress install

      - name: Run e2e happy-path tests
        id: e2e-test
        run: npm run cypress:omit:critical

      - name: Stop API for critical tests
        run: docker compose stop server

      - name: 🎭 Run critical e2e tests
        id: e2e-critical-test
        run: npm run cypress:run:critical

      - name: E2E report
        if: always()
        run: |
          echo "Node.js version: $(node -v)"
          if [[ "${{ steps.e2e-test.outcome }}" == "success" && "${{ steps.e2e-critical-test.outcome }}" == "success" ]]; then
            echo "✅ End-to-End tests passed"
          else
            echo "❌ End-to-End tests failed"
          fi

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish:
    name: 📦 Publish to npm
    runs-on: ubuntu-latest
    needs: [build, test, e2e]
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Node.js and dependencies
        uses: ./.github/actions/install-node

      - name: Authenticate with npm
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Version check
        id: version-check
        run: |
          LOCAL_VERSION=$(jq -r '.version' package.json)
          echo "Local version: $LOCAL_VERSION"

          PUBLISHED_VERSION=$(npm view @myvco/projet-test version 2>/dev/null || echo "none")
          echo "Published version: $PUBLISHED_VERSION"

          if [[ "$PUBLISHED_VERSION" == "none" ]]; then
            echo "First publish detected"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          elif [[ "$(printf '%s\n' "$PUBLISHED_VERSION" "$LOCAL_VERSION" | sort -V | tail -n1)" == "$LOCAL_VERSION" && "$LOCAL_VERSION" != "$PUBLISHED_VERSION" ]]; then
            echo "✅ Version is ready to publish"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ Version must be greater than published version"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Publish package
        if: steps.version-check.outputs.should_publish == 'true'
        run: |
          npm run build:npm
          npm publish --access public

  docker-build-and-run:
    name: 🐳 Build and Run Docker Containers
    runs-on: ubuntu-latest
    needs: [publish]
    env:
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      MYSQL_HOST: ${{ secrets.MYSQL_HOST }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Get npm version
        id: version-tag
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 🐳 Build and run Docker
        run: docker compose up --build -d

      - name: ⏳ Wait for services
        run: sleep 5

      - name: ✅ Verify MySQL is running
        run: |
          if docker compose exec -T db mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent > /dev/null 2>&1; then
            echo "✅ MySQL is running"
          else
            echo "❌ MySQL is not running"
            docker compose logs db
            exit 1
          fi

      - name: ✅ Verify API is running
        run: |
          RESPONSE=$(curl -sf http://localhost:8000/users)
          echo "$RESPONSE"
          USERS_COUNT=$(echo "$RESPONSE" | jq '.utilisateurs | length')
          if [[ $USERS_COUNT -eq 0 ]]; then
            echo "❌ Error: users list is empty"
            exit 1
          fi
          echo "✅ API is running with $USERS_COUNT user(s)"

      - name: ✅ Verify Web is running
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5173)
          if [[ "$HTTP_STATUS" -eq 200 || "$HTTP_STATUS" -eq 302 ]]; then
            echo "✅ Web application is running, status: $HTTP_STATUS"
          else
            echo "❌ Web application is not running, status: $HTTP_STATUS"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.version-tag.outputs.VERSION }}
        run: |
          docker tag api_python $DOCKER_USERNAME/api_python:latest
          docker tag api_python $DOCKER_USERNAME/api_python:$IMAGE_TAG

      - name: Push Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ steps.version-tag.outputs.VERSION }}
        run: |
          docker push $DOCKER_USERNAME/api_python:latest
          docker push $DOCKER_USERNAME/api_python:$IMAGE_TAG

      - name: Show docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: [publish]

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4