version: "3.8"
services:
  db:
    image: migration_mysql
    restart: always
    environment:
       - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
       - MYSQL_DATABASE=${MYSQL_DATABASE}
    ports:
      - 3307:3306
    volumes:
      - ./sqlfiles/:/docker-entrypoint-initdb.d/

  adminer:
    depends_on:
      - db
    image: adminer
    restart: always
    ports:
      - 8080:8080

  server:
    depends_on:
      - db
    restart: always
    build:
      context: ./server
      dockerfile: fastapi.Dockerfile
    environment:
     - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
     - MYSQL_DATABASE=${MYSQL_DATABASE}
     - MYSQL_HOST=db
     - MYSQL_USER
    container_name: server-container
    ports:
     - "8000:8000"